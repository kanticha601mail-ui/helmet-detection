<script>
    const URL = "https://teachablemachine.withgoogle.com/models/lGvg1Scey/"; 

    let model, webcam, maxPredictions;
    let alarmSound = document.getElementById("alarm");

    // ตัวแปรสำหรับคุมการถ่ายรูปภาพ
    let lastCaptureTime = 0;
    let captureCount = 0;
    const CAPTURE_COOLDOWN = 10000; // หน่วงเวลา 10 วินาที

    // Motion Detection & State Memory Variables
    let prevFrameCtx = null;
    let prevFrameCanvas = null;
    let lastMotionTime = 0; 
    const HOLD_STATE_DURATION = 3000; // คงสถานะตรวจจับไว้ 3 วินาทีหลังการเคลื่อนไหวหยุดลง

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        document.getElementById("status-box").innerText = "กำลังโหลดโมเดล...";

        // ปลดล็อกการเล่นเสียง Alarm บนเบราว์เซอร์
        alarmSound.play().then(() => {
            alarmSound.pause();
            alarmSound.currentTime = 0;
        }).catch(() => {});

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = false;
        webcam = new tmImage.Webcam(320, 320, flip);
        await webcam.setup({ facingMode: "environment" });
        await webcam.play();
        
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        prevFrameCanvas = document.createElement('canvas');
        prevFrameCanvas.width = 320;
        prevFrameCanvas.height = 320;
        prevFrameCtx = prevFrameCanvas.getContext('2d');

        window.requestAnimationFrame(loop);
    }

    async function loop() {
        webcam.update();
        
        const isMoving = detectMotion();
        const currentTime = Date.now();
        const statusBox = document.getElementById("status-box");

        if (isMoving) {
            lastMotionTime = currentTime;
        }

        // ตรวจสอบว่ายังมี Motion อยู่ หรือเพิ่งหยุดเคลื่อนไหวไม่เกิน 3 วินาทีหรือไม่
        if (currentTime - lastMotionTime < HOLD_STATE_DURATION && lastMotionTime !== 0) {
            await predict();
        } else {
            // หากไม่มีการเคลื่อนไหวเกิน 3 วินาที ให้บังคับเป็นสถานะ Waiting
            statusBox.innerHTML = `Waiting 💤`;
            statusBox.className = "idle";
        }

        window.requestAnimationFrame(loop);
    }

    function detectMotion() {
        const currentCtx = webcam.canvas.getContext('2d');
        const currentData = currentCtx.getImageData(0, 0, 320, 320).data;
        
        if (!prevFrameCtx.hasData) {
            prevFrameCtx.putImageData(currentCtx.getImageData(0, 0, 320, 320), 0, 0);
            prevFrameCtx.hasData = true;
            return false;
        }

        const prevData = prevFrameCtx.getImageData(0, 0, 320, 320).data;
        let diffCount = 0;

        for (let i = 0; i < currentData.length; i += 16) {
            const rDiff = Math.abs(currentData[i] - prevData[i]);
            const gDiff = Math.abs(currentData[i+1] - prevData[i+1]);
            const bDiff = Math.abs(currentData[i+2] - prevData[i+2]);

            if (rDiff + gDiff + bDiff > 150) {
                diffCount++;
            }
        }

        prevFrameCtx.putImageData(currentCtx.getImageData(0, 0, 320, 320), 0, 0);
        return diffCount > 35;
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let noHelmetProb = 0;
        let wearingHelmetProb = 0;

        // ดึงค่าตามชื่อ Class "No Helmet" และ "Wearing Helmet"
        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className.trim().toLowerCase();
            
            if (className === "no helmet") {
                noHelmetProb = prediction[i].probability;
            } else if (className === "wearing helmet" || className === "helmet") {
                wearingHelmetProb = prediction[i].probability;
            }
        }

        const statusBox = document.getElementById("status-box");
        const currentTime = Date.now();

        // 1. ตรวจพบไม่สวมหมวก (ความมั่นใจ > 80%)
        if (noHelmetProb > 0.8) {
            statusBox.innerHTML = `No Helmet ⚠️ (${(noHelmetProb * 100).toFixed(0)}%)`;
            statusBox.className = "alert";
            
            if (alarmSound.paused) {
                alarmSound.play().catch(() => {});
            }

            if (currentTime - lastCaptureTime > CAPTURE_COOLDOWN) {
                captureSnapshot();
                lastCaptureTime = currentTime;
            }

        // 2. ตรวจพบสวมหมวก (ความมั่นใจ > 80%)
        } else if (wearingHelmetProb > 0.8) {
            statusBox.innerHTML = `Wearing Helmet ✅ (${(wearingHelmetProb * 100).toFixed(0)}%)`;
            statusBox.className = "safe";

        // 3. ผลก้ำกึ่ง (เช่น < 80%)
        } else {
            statusBox.innerHTML = `Waiting 💤`;
            statusBox.className = "idle";
        }
    }

    function captureSnapshot() {
        const canvas = webcam.canvas;
        const imageBase64 = canvas.toDataURL("image/jpeg");
        
        const now = new Date();
        const timestamp = now.toISOString().replace(/[:.]/g, "-");
        const fileName = `no-helmet_${timestamp}.jpg`;

        const a = document.createElement("a");
        a.href = imageBase64;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        captureCount++;
        document.getElementById("log-count").innerText = `บันทึกภาพไปแล้ว: ${captureCount} ภาพ`;
    }
</script>
